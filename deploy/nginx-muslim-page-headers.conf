# Заголовки для страниц и файлов фронта кафе «Муслим».
# Положить в /etc/nginx/snippets/muslim-page-headers.conf (его подключает deploy/nginx-muslim.conf).
# Здесь повторены общие защитные заголовки: в location со своим add_header общие из server не действуют.

add_header Cache-Control "no-cache" always;                                  # после обновления браузер проверяет, не изменился ли файл
add_header X-Content-Type-Options "nosniff" always;                         # браузер не «угадывает» тип файла
add_header X-Frame-Options "DENY" always;                                   # сайт нельзя встроить в чужую страницу
add_header Referrer-Policy "same-origin" always;                            # наши адреса не утекают на чужие сайты
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;   # камера и т.п. сайту не нужны
add_header Cross-Origin-Opener-Policy "same-origin" always;                 # чужая вкладка не управляет нашей
# CSP: скрипты, стили, картинки и запросы — только с нашего адреса. Картинки data:/blob: — фото до загрузки и QR.
# Встроенные стили разрешены (ширина полосок в отчётах), встроенные скрипты — нет
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; worker-src 'none'; manifest-src 'self'" always;
