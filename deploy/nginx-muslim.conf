# nginx для кафе «Муслим»: один адрес — и меню гостей, и панель, и API.
# Положить в /etc/nginx/sites-available/muslim

# ---------- Ограничение частоты (защита от подбора пароля и спама) ----------
# Считаем запросы по IP. Вход, продление и выход — не больше 10 в минуту, заказы и вызовы — не больше 30 в минуту
limit_req_zone $binary_remote_addr zone=muslim_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=muslim_orders:10m rate=30r/m;
limit_req_status 429;                                   # «слишком много запросов»

server {
    listen 80;
    server_name _;                                      # любой адрес (IP). Когда будет домен — впишем его сюда

    server_tokens off;                                  # не показываем версию nginx (меньше подсказок взломщику)
    client_max_body_size 5M;                            # фото блюд до 5 МБ, больше — отказ
    client_body_timeout 15s;                            # медленные «зависшие» запросы обрываем
    client_header_timeout 15s;

    # Защитные заголовки для всех ответов.
    # ВАЖНО: если внутри location есть свой add_header, эти строки там НЕ действуют — их надо повторить (ниже так и сделано)
    add_header X-Content-Type-Options "nosniff" always;              # браузер не «угадывает» тип файла
    add_header X-Frame-Options "DENY" always;                        # сайт нельзя встроить в чужую страницу
    add_header Referrer-Policy "same-origin" always;                 # наши адреса не утекают на чужие сайты
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;   # камера и т.п. сайту не нужны

    root /home/muslim/app/frontend/dist;                # готовые файлы фронта

    # Скрытые файлы (.env, .git и т.п.) не отдаём никогда (кроме .well-known — он нужен для HTTPS-сертификата)
    location ~ /\.(?!well-known) { return 404; }

    # ---------- Страницы сайта: меню гостей и панель кафе ----------
    # CSP — браузер выполняет только наши скрипты с нашего адреса. Если в страницу когда-нибудь
    # попадёт чужой скрипт (вставка через текст, заражённая ссылка), браузер его не запустит —
    # и не отдаст токены входа сотрудника
    location = /      { try_files /index.html =404; include /etc/nginx/snippets/muslim-page-headers.conf; }
    location = /admin { try_files /admin.html =404; include /etc/nginx/snippets/muslim-page-headers.conf; }
    location = /admin/ { try_files /admin.html =404; include /etc/nginx/snippets/muslim-page-headers.conf; }
    location = /index.html { include /etc/nginx/snippets/muslim-page-headers.conf; }
    location = /admin.html { include /etc/nginx/snippets/muslim-page-headers.conf; }

    # QR-код стола: /t/<токен> → меню с этим столом
    location ~ ^/t/([A-Za-z0-9_-]+)/?$ { return 302 /?token=$1; }

    # Настройки фронта: API на этом же адресе, путь /backend/api
    location = /runtime-config.js {
        default_type text/javascript;
        include /etc/nginx/snippets/muslim-page-headers.conf;
        return 200 'window.MUSLIM_CONFIG={apiBase:"/backend/api",apiOrigin:location.origin,apiDocs:"/api/docs/"};';
    }

    # Фото блюд: фронт просит их по адресу /backend/media/... — отдаём сразу из папки, без Django
    location /backend/media/ { alias /home/muslim/app/media/; expires 7d; }

    # Вход, продление и выход сотрудников — с ограничением частоты
    location ~ ^/backend/api/auth/(login|refresh|logout)/$ {
        limit_req zone=muslim_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/auth/$1/;
        include /etc/nginx/proxy_params;
    }

    # Заказы и вызовы официанта от гостей — с ограничением частоты
    location ~ ^/backend/api/(orders|table-calls)/$ {
        limit_req zone=muslim_orders burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000/api/$1/;
        include /etc/nginx/proxy_params;
    }

    # Остальное API: фронт ходит в Django через /backend/api/... (приставку /backend отрезаем).
    # Только API — Django-админка и прочее через /backend/ недоступны
    location /backend/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        include /etc/nginx/proxy_params;                # передаём Django адрес сайта и IP гостя
    }
    location /backend/ { return 404; }

    # Swagger — напрямую в Django (на сервере его видят только админы). Всё остальное /api/ снаружи закрыто:
    # вход только через /backend/api/auth/... — там стоит ограничение частоты
    location ~ ^/api/(docs|schema)/$ { proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; }
    location /api/ { return 404; }

    # Django-админка на секретном адресе: /manage-<секрет>/ (сам секрет — в .env, DJANGO_ADMIN_URL)
    location ~ ^/manage-[A-Za-z0-9_-]+/ {
        limit_req zone=muslim_orders burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Файлы Django-админки и фото блюд nginx отдаёт сам — так быстрее
    location /static/ { alias /home/muslim/app/staticfiles/; expires 7d; }
    location /media/  { alias /home/muslim/app/media/; expires 7d; }

    # Остальные файлы фронта (js, css, картинки). После обновления браузер проверяет, не изменились ли они
    location / {
        try_files $uri =404;
        include /etc/nginx/snippets/muslim-page-headers.conf;
    }
}
